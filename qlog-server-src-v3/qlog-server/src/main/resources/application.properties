# QLog Server Configuration (application.properties) - v3 (Standalone Mode Added)

# --- Server Port ---
server.port=8080

# --- Database Configuration (H2 file example) ---
# Using H2 file-based database for simplicity. Replace with your production database settings (PostgreSQL, MySQL, etc.).
spring.datasource.url=jdbc:h2:file:./qlogdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Enable H2 console (optional, for debugging) at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false # Keep false for security unless needed

# --- JPA / Hibernate Configuration ---
# Automatically update the database schema based on entities (use validate or none in production)
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in logs (optional, for debugging)
spring.jpa.show-sql=false
# Format SQL statements in logs (optional)
# spring.jpa.properties.hibernate.format_sql=true

# --- JPA Batch Processing Optimization ---
# Enable JDBC batch inserts/updates for better performance when saving many records.
# Adjust batch_size based on your database performance and memory.
spring.jpa.properties.hibernate.jdbc.batch_size=50
# Optimize batching order for inserts and updates.
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Optional: Enable batching for versioned data if using @Version annotation (not used in current model).
# spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# --- Agent Authentication ---
# Configure basic authentication credentials for incoming agent requests.
# Ensure these match the credentials configured in the agent.properties file.
spring.security.user.name=agent_user
spring.security.user.password=YourStrongAgentPassword
# Assign a role for agent access control (used in SecurityConfig).
spring.security.user.roles=AGENT

# --- Standalone Local Log Monitoring (Optional) ---
# Enable monitoring of a local directory by the server itself.
local.monitor.enabled=false

# The directory for the server to monitor locally.
# Required if local.monitor.enabled=true. Use forward slashes (/) or escaped backslashes (\\).
local.monitor.directory=C:/Path/To/Local/Quintiq/Logs

# The file pattern for local log files.
local.monitor.filePattern=QServerTrans_*.csv

# How often (in seconds) the server checks the local directory.
local.monitor.poll.interval.seconds=30

# The context name to assign to logs processed locally by the server.
local.monitor.context=LocalServerContext

# The file path for storing the state of the local monitor.
local.monitor.state.filePath=./local-monitor-state.json

# --- Spring Boot Actuator (Optional) ---
# Expose health and info endpoints (e.g., /actuator/health)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.example.qlogserver=DEBUG # More detailed logging for the application
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN # Set to DEBUG to see SQL, TRACE for parameters
logging.level.org.hibernate.type.descriptor.sql=WARN # Set to TRACE to see bound parameters

# --- Asynchronous Processing (for Agent Submissions) ---
# Configure thread pool for @Async tasks
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.queue-capacity=100
spring.task.execution.thread-name-prefix=qlog-async-

# --- Scheduling (for Local Monitor) ---
# Enable scheduling for tasks like the local monitor
spring.task.scheduling.pool.size=1 # Usually 1 is enough for the local monitor
spring.task.scheduling.thread-name-prefix=qlog-sched-

# --- Server-side Compression Handling ---
# Spring Boot typically handles Gzip request decompression automatically if Content-Encoding header is present.
# Enable Gzip response compression if desired (for UI/API responses, not agent requests)
# server.compression.enabled=true
# server.compression.mime-types=application/json,text/html,text/css,application/javascript
# server.compression.min-response-size=2048 # Only compress responses larger than 2KB

